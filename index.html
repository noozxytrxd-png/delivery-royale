<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delivery Royale 3D - 4 Players Party</title>
    <!-- Three.js Engine & PeerJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; user-select: none; }
        body { background: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        
        /* 🎨 1. LOBBY & MENU OVERLAY */
        #lobbyOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 15, 25, 0.95); backdrop-filter: blur(8px);
            z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 16px; overflow-y: auto;
        }
        .menu-card {
            background: #161b22; border: 1px solid #30363d; border-radius: 16px;
            padding: 18px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; gap: 10px;
        }
        .menu-title { font-size: 1.3rem; font-weight: 900; color: #38bdf8; text-align: center; text-transform: uppercase; }
        
        .form-row { display: flex; flex-direction: column; gap: 4px; }
        .form-row label { font-size: 0.75rem; color: #94a3b8; font-weight: bold; }
        .form-row input, .form-row select {
            background: #0d1117; border: 1px solid #30363d; padding: 8px 10px; border-radius: 8px;
            color: #fff; font-weight: bold; font-size: 0.85rem; outline: none;
        }
        .form-row input[type="color"] { height: 38px; cursor: pointer; padding: 2px; }
        
        .config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .room-box { background: #0d1117; border: 1px dashed #38bdf8; border-radius: 10px; padding: 10px; text-align: center; }
        
        /* 👥 LOBBY PLAYER LIST */
        .lobby-players-box {
            background: #0d1117; border: 1px solid #30363d; border-radius: 10px;
            padding: 8px 12px; max-height: 110px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
        }
        .lobby-player-item {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.8rem; font-weight: bold; background: #161b22; padding: 4px 8px; border-radius: 6px;
        }
        .btn-kick { background: #ef4444; color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; }

        .btn-action {
            background: #2563eb; color: #fff; border: none; padding: 12px; border-radius: 10px;
            font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; margin-top: 4px;
        }
        .btn-action:disabled { background: #334155; color: #64748b; cursor: not-allowed; }
        
        /* 🎮 2. IN-GAME HUD OVERLAY */
        #hudOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: none; flex-direction: column;
            justify-content: space-between; padding: 12px; z-index: 10;
        }
        .interactive { pointer-events: auto; }
        
        .top-hud { display: flex; justify-content: space-between; width: 100%; align-items: flex-start; }
        .timer-box { background: rgba(15, 23, 42, 0.9); border: 1px solid #f59e0b; padding: 6px 14px; border-radius: 20px; font-weight: 900; font-size: 1.1rem; color: #facc15; }
        
        .leaderboard {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
            padding: 8px 12px; border-radius: 12px; border: 1px solid #38bdf8;
            display: flex; flex-direction: column; gap: 4px; max-height: 140px; overflow-y: auto; width: 160px;
        }
        .lb-item { display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: bold; }
        
        .controls-zone { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 10px; }
        .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; width: 140px; height: 140px; }
        .btn-pad { background: rgba(51, 65, 85, 0.7); color: #fff; border: 1px solid #64748b; border-radius: 10px; font-size: 1.2rem; display: flex; justify-content: center; align-items: center; }
        .btn-pad:active { background: #38bdf8; }
        .btn-item { background: #ef4444; color: #fff; border: 2px solid #f87171; width: 75px; height: 75px; border-radius: 50%; font-weight: bold; font-size: 0.85rem; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
    </style>
</head>
<body>

    <!-- 🎨 1. LOBBY & MENU OVERLAY -->
    <div id="lobbyOverlay">
        <div class="menu-card">
            <div class="menu-title">🚚 Delivery Royale (4P)</div>
            
            <div class="form-row">
                <label>👤 ชื่อพนักงาน:</label>
                <input type="text" id="inputName" value="Driver_1" maxlength="10" oninput="updateMyProfileLocal()">
            </div>

            <div class="config-grid">
                <div class="form-row">
                    <label>🎨 สียูนิฟอร์ม:</label>
                    <input type="color" id="inputColor" value="#38bdf8" oninput="updateMyProfileLocal()">
                </div>
                <div class="form-row">
                    <label>👑 หมวก 3D:</label>
                    <select id="inputHat" onchange="updateMyProfileLocal()">
                        <option value="none">ไม่ใส่</option>
                        <option value="crown">👑 มงกุฎ</option>
                        <option value="cap">🧢 หมวกแก๊ป</option>
                        <option value="horns">😈 เขาปีศาจ</option>
                    </select>
                </div>
            </div>

            <!-- ตั้ง/สร้างรหัสห้องสำหรับ Host -->
            <div class="room-box">
                <div style="font-size:0.75rem; color:#94a3b8; margin-bottom:4px;">ตั้งรหัสห้องของคุณ (4 หลัก):</div>
                <div style="display:flex; gap:6px;">
                    <input type="number" id="hostRoomCode" style="flex:1; text-align:center; font-size:1.1rem; font-weight:bold; color:#38bdf8;" placeholder="1234" maxlength="4">
                    <button style="background:#0284c7; color:#fff; border:none; padding:0 12px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="changeRoomCode()">ตั้งรหัส ⚙️</button>
                </div>
            </div>

            <!-- รายชื่อคนในห้อง -->
            <div class="form-row">
                <label>👥 ผู้เล่นในห้อง (<span id="playerCountText">1</span>/4 คน):</label>
                <div class="lobby-players-box" id="lobbyPlayerList">
                    <!-- Dynamic Joined Players -->
                </div>
            </div>

            <!-- เข้าร่วมห้องเพื่อน -->
            <div class="form-row">
                <label>🔑 เข้าร่วมห้องเพื่อน:</label>
                <div style="display:flex; gap:6px;">
                    <input type="number" id="inputJoinCode" placeholder="กรอกรหัสห้อง 4 หลัก" style="flex:1;">
                    <button style="background:#2563eb; color:#fff; border:none; padding:0 16px; border-radius:8px; font-weight:bold; cursor:pointer;" onclick="joinRoom()">จอยห้อง 🚀</button>
                </div>
            </div>

            <div id="statusText" style="font-size:0.75rem; color:#f59e0b; text-align:center; font-weight:bold;">⏳ กำลังเชื่อมต่อระบบ...</div>

            <button class="btn-action" id="btnStartGame" onclick="startGame()" disabled>🚀 เริ่มการแข่งขัน</button>
        </div>
    </div>

    <!-- 🎮 2. IN-GAME HUD OVERLAY -->
    <div id="hudOverlay">
        <div class="top-hud">
            <div class="leaderboard" id="lbContainer">
                <div style="font-size:0.7rem; color:#38bdf8; font-weight:900; border-bottom:1px solid #334155; padding-bottom:2px;">🏆 อันดับคะแนน</div>
            </div>
            <div class="timer-box" id="timerDisplay">03:00</div>
        </div>

        <div class="controls-zone">
            <div class="dpad interactive">
                <div></div><button class="btn-pad" ontouchstart="startMove(0, -0.35)" ontouchend="stopMove()">⬆️</button><div></div>
                <button class="btn-pad" ontouchstart="startMove(-0.35, 0)" ontouchend="stopMove()">⬅️</button><div></div><button class="btn-pad" ontouchstart="startMove(0.35, 0)" ontouchend="stopMove()">➡️</button>
                <div></div><button class="btn-pad" ontouchstart="startMove(0, 0.35)" ontouchend="stopMove()">⬇️</button><div></div>
            </div>
            <button class="btn-item interactive" onclick="useItem()">🔫 ยิงป่วน</button>
        </div>
    </div>

    <script>
        const MAX_PLAYERS = 4; // ล็อกจำนวนผู้เล่นสูงสุดไว้ที่ 4 คน

        // 🎮 1. THREE.JS ENGINE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 26, 26);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 25, 10);
        scene.add(dirLight);

        // 🏝️ เกาะลอยฟ้า
        const island = new THREE.Mesh(
            new THREE.CylinderGeometry(14, 12, 2, 32),
            new THREE.MeshLambertMaterial({ color: 0x1e293b })
        );
        island.position.y = -1;
        scene.add(island);

        // 🏠 บ้านเป้าหมาย
        const houseGroup = new THREE.Group();
        const houseBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 2.2, 2.2), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
        const roof = new THREE.Mesh(new THREE.ConeGeometry(2.0, 1.4, 4), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
        roof.position.y = 1.8; roof.rotation.y = Math.PI / 4;
        houseGroup.add(houseBody, roof);
        houseGroup.position.set(5, 1, 0);
        scene.add(houseGroup);

        // 📦 พัสดุ
        const packageMesh = new THREE.Mesh(
            new THREE.BoxGeometry(1.2, 1.2, 1.2),
            new THREE.MeshLambertMaterial({ color: 0xfacc15 })
        );
        packageMesh.position.set(0, 0.6, 0);
        scene.add(packageMesh);

        // 👑 2. 3D CHARACTER MESH BUILDER
        function createNameTag(text) {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(10, 10, 236, 44);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(text, 128, 40);
            
            const texture = new THREE.CanvasTexture(canvas);
            const spriteMat = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(spriteMat);
            sprite.scale.set(4, 1, 1);
            sprite.position.y = 2.8;
            return sprite;
        }

        function createPlayerMesh(profile) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.2, 1.8, 1.2),
                new THREE.MeshLambertMaterial({ color: profile.color || '#38bdf8' })
            );
            body.position.y = 0.9;
            group.add(body);

            if (profile.hat === 'crown') {
                const crown = new THREE.Mesh(new THREE.ConeGeometry(0.6, 0.6, 5), new THREE.MeshLambertMaterial({ color: 0xf59e0b }));
                crown.position.y = 2.1; group.add(crown);
            } else if (profile.hat === 'cap') {
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 0.3, 16), new THREE.MeshLambertMaterial({ color: 0xef4444 }));
                cap.position.y = 2.0; group.add(cap);
            } else if (profile.hat === 'horns') {
                const h1 = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.6, 8), new THREE.MeshLambertMaterial({ color: 0xdc2626 }));
                h1.position.set(-0.4, 2.0, 0); h1.rotation.z = -0.3;
                const h2 = h1.clone(); h2.position.set(0.4, 2.0, 0); h2.rotation.z = 0.3;
                group.add(h1, h2);
            }

            group.add(createNameTag(profile.name || "Player"));
            return group;
        }

        // 🕹️ 3. MULTI-PLAYER STATE & ROOM MANAGEMENT
        let isHost = true;
        let myId = null;
        let connections = {}; 
        let guestConn = null; 
        let peer = null;

        let players = {}; 
        let playerMeshes = {}; 

        let packageHolderId = null; 
        let pickupCooldown = 0;
        let moveVec = { x: 0, z: 0 };
        let gameTimeSeconds = 180;
        let timerInterval = null;

        let myProfile = { name: "Driver_1", color: "#38bdf8", hat: "none" };

        function updateMyProfileLocal() {
            myProfile.name = document.getElementById('inputName').value.trim() || "Driver";
            myProfile.color = document.getElementById('inputColor').value;
            myProfile.hat = document.getElementById('inputHat').value;

            if (myId && players[myId]) {
                players[myId].profile = myProfile;
                if (isHost) {
                    renderLobbyList();
                    broadcastWorldState();
                } else if (guestConn && guestConn.open) {
                    guestConn.send({ type: 'UPDATE_PROFILE', profile: myProfile });
                }
            }
        }

        function kickPlayer(targetPeerId) {
            if (!isHost) return;
            if (connections[targetPeerId]) {
                connections[targetPeerId].send({ type: 'KICKED', msg: 'คุณถูก Host เตะออกจากห้อง!' });
                connections[targetPeerId].close();
            }
            removePlayer(targetPeerId);
        }

        function removePlayer(peerId) {
            delete connections[peerId];
            delete players[peerId];
            if (playerMeshes[peerId]) {
                scene.remove(playerMeshes[peerId]);
                delete playerMeshes[peerId];
            }
            renderLobbyList();
            broadcastWorldState();
        }

        function renderLobbyList() {
            const listEl = document.getElementById('lobbyPlayerList');
            const countEl = document.getElementById('playerCountText');
            
            const pList = Object.values(players);
            countEl.innerText = pList.length;

            let html = '';
            pList.forEach(p => {
                const isMe = p.id === myId;
                html += `
                    <div class="lobby-player-item">
                        <span style="color: ${p.profile.color};">
                            ${p.profile.hat !== 'none' ? '👑 ' : ''}${p.profile.name} ${isMe ? '(คุณ)' : ''}
                        </span>
                        ${(isHost && !isMe) ? `<button class="btn-kick" onclick="kickPlayer('${p.id}')">❌ เตะ</button>` : ''}
                    </div>`;
            });
            listEl.innerHTML = html;
        }

        function startMove(x, z) { moveVec = { x, z }; }
        function stopMove() { moveVec = { x: 0, z: 0 }; }

        function useItem() {
            if (!myId) return;
            if (isHost) {
                handleItemUse(myId);
            } else if (guestConn && guestConn.open) {
                guestConn.send({ type: 'USE_ITEM' });
            }
        }

        function handleItemUse(userId) {
            if (!packageHolderId || packageHolderId === userId) return;
            const attacker = players[userId];
            const victim = players[packageHolderId];
            if (!attacker || !victim) return;

            const dist = Math.hypot(attacker.x - victim.x, attacker.z - victim.z);
            if (dist < 8) {
                packageHolderId = null;
                pickupCooldown = Date.now() + 500;
                
                packageMesh.position.x = Math.max(-10, Math.min(10, victim.x + (Math.random() > 0.5 ? 2 : -2)));
                packageMesh.position.z = Math.max(-10, Math.min(10, victim.z + (Math.random() > 0.5 ? 2 : -2)));
                broadcastWorldState();
            }
        }

        function relocateHouse() {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 8 + 3;
            houseGroup.position.x = Math.cos(angle) * radius;
            houseGroup.position.z = Math.sin(angle) * radius;
        }

        // 🌐 4. PEERJS INITIALIZATION WITH CUSTOM ROOM CODE
        const statusText = document.getElementById('statusText');
        const btnStartGame = document.getElementById('btnStartGame');

        // สุ่มรหัสห้องเริ่มต้น 4 หลัก
        let initialCode = Math.floor(1000 + Math.random() * 9000).toString();
        document.getElementById('hostRoomCode').value = initialCode;

        function initHostPeer(code) {
            if (peer) peer.destroy();

            isHost = true;
            const fullPeerId = `delivery-royale-4p-${code}`;
            peer = new Peer(fullPeerId);

            peer.on('open', (id) => {
                myId = id;
                statusText.innerText = `🟢 เปิดห้องรหัส [${code}] สำเร็จ! (สูงสุด 4 คน)`;
                statusText.style.color = '#34d399';
                btnStartGame.disabled = false;

                players = {};
                players[myId] = { id: myId, x: 0, z: 4, score: 0, profile: myProfile };
                renderLobbyList();
            });

            peer.on('error', (err) => {
                if (err.type === 'unavailable-id') {
                    statusText.innerText = '❌ รหัสห้องนี้มีคนใช้อยู่แล้ว กรุณาเปลี่ยนเลข!';
                } else {
                    statusText.innerText = `❌ ข้อผิดพลาด: ${err.type}`;
                }
                statusText.style.color = '#f87171';
            });

            // รับคนเข้าห้อง
            peer.on('connection', (conn) => {
                if (!isHost) return;
                
                conn.on('open', () => {
                    if (Object.keys(connections).length + 1 >= MAX_PLAYERS) {
                        conn.send({ type: 'ERROR', msg: 'ห้องเต็มแล้ว! (รับได้สูงสุด 4 คน)' });
                        conn.close();
                        return;
                    }

                    connections[conn.peer] = conn;
                    statusText.innerText = `🟢 มีผู้เล่นเข้าห้อง (${Object.keys(connections).length + 1}/${MAX_PLAYERS} คน)`;
                });

                conn.on('data', (data) => {
                    if (data.type === 'JOIN_PROFILE') {
                        const pCount = Object.keys(players).length;
                        const angle = (pCount * (Math.PI * 2)) / MAX_PLAYERS;

                        players[conn.peer] = {
                            id: conn.peer,
                            x: Math.cos(angle) * 6,
                            z: Math.sin(angle) * 6,
                            score: 0,
                            profile: data.profile
                        };
                        
                        renderLobbyList();
                        broadcastWorldState();
                    } else if (data.type === 'UPDATE_PROFILE') {
                        if (players[conn.peer]) {
                            players[conn.peer].pro
